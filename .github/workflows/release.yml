name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package.json version v$version"
          }

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package NSIS installer
        run: npx electron-builder --win nsis --publish never

      - name: Write checksums
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt -Encoding ascii

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @()
          $files += Get-ChildItem release -Filter *.exe | ForEach-Object FullName
          $files += Get-ChildItem release -Filter *.blockmap | ForEach-Object FullName
          $files += (Resolve-Path release/SHA256SUMS.txt).Path
          gh release create "${{ github.ref_name }}" --title "TokenHUB ${{ github.ref_name }}" --generate-notes @files
